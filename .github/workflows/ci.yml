name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.6'
      - name: Install dependencies
        run: python3.9 -m pip install -e ".[dev]"
      - name: Run tests
        run: python3.9 -m pytest
