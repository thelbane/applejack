[build-system]
requires = ["setuptools==60.2.0", "wheel==0.37.1"]
build-backend = "setuptools.build_meta"

[project]
name = "applejack"
version = "0.1.0"
description = "Applejack V2 Applesoft BASIC compiler"
requires-python = "==3.9.6"
dependencies = [
  "lark==1.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
]

[project.scripts]
applejack = "applejack.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
